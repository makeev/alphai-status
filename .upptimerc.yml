owner: makeev
repo: alphai-status

sites:
  # 1) Website — CloudFront edge chain (real-user path). Shallow by design: its
  #    job is to prove the edge routes; deep health is monitor #2. The ONLY probe
  #    that rides CloudFront, so the WAF caveat applies here alone.
  - name: Website
    url: https://alphai.io/api/health_check
    expectedStatusCodes: [200]
    headers:
      - "User-Agent: AlphaAI-Upptime/1.0 (+https://status.alphai.io)"
  # 2) REST API — DEEP health (source of truth). SELECT 1 + Redis PING; direct-ALB
  #    (thin rate-WAF, runners pass) → no WAF risk. 503 = a real outage.
  - name: REST API
    url: https://api.alphai.io/api/health/ready
    expectedStatusCodes: [200]
    headers:
      - "User-Agent: AlphaAI-Upptime/1.0 (+https://status.alphai.io)"
  # 3) Public API gate — proves the key-only host + auth layer are up. Polarity:
  #    401 = up (auth answers before the DB; data-plane is monitor #2's job).
  - name: Public API gate
    url: https://api.alphai.io/api/news/
    expectedStatusCodes: [401]
    headers:
      - "User-Agent: AlphaAI-Upptime/1.0 (+https://status.alphai.io)"
  - name: MCP server
    url: https://mcp.alphai.io/health
    expectedStatusCodes: [200]
    headers:
      - "User-Agent: AlphaAI-Upptime/1.0 (+https://status.alphai.io)"

status-website:
  cname: status.alphai.io
  name: AlphaAI Status
  introTitle: "AlphaAI status"
  introMessage: "Live availability of the AlphaAI website, public REST API, and MCP server."
  navbar:
    - title: Home
      href: https://alphai.io
    - title: Changelog
      href: https://alphai.io/changelog

assignees:
  - makeev
